<app-card>
  <ng-container card-titulo>
  <img  src="icones/saldo.PNG" alt="" >
  <h2 class="texto-lg">
    Saldo disponível:
  </h2>
  </ng-container>

  <span
    class="valor texto-xxxl"
    [appDestaqueValorNumerico]="saldo()"
    corPositiva="var(--violeta-destaque)"
  >
    {{ saldo() | currency: "BRL" }}
  </span>
</app-card>
